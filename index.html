<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Critical font preloads — must be first resource hints to maximise download window.
         All three fonts are used in Hero above the fold; preload prevents FOUT on first paint.
         Ekaterina (68 KB) is used for accentLetter and subAccent — both in the first viewport. -->
    <link rel="preload" href="/fonts/Forum.woff2"                as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bad-russian.woff2"          as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/ekaterinavelikayatwo.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Critical inline CSS: registers @font-face and :root variables immediately,
         so the page has correct colours/fonts from first paint even while the
         main CSS bundle (index-*.css) is still downloading on a cold cache. -->
    <style>
      @font-face{font-family:'Bad Russian';src:url('/fonts/bad-russian.woff2') format('woff2'),url('/fonts/bad-russian.woff') format('woff');font-weight:400;font-style:normal;font-display:fallback}
      @font-face{font-family:Forum;src:url('/fonts/Forum.woff2') format('woff2');font-weight:400;font-style:normal;font-display:fallback}
      @font-face{font-family:'Ekaterina Velikaya Two';src:url('/fonts/ekaterinavelikayatwo.woff2') format('woff2');font-weight:400;font-style:normal;font-display:fallback}
      /* Great Vibes (FR display) и Dela Gothic One (номера секций) — самохостинг вместо
         Google Fonts: их CSS был render-blocking и тянул два сторонних соединения.
         unicode-range: браузер качает файл, только когда на странице есть такие символы;
         Great Vibes нужен только французской версии. Лицензия SIL OFL 1.1. */
      @font-face{font-family:'Great Vibes';src:url('/fonts/great-vibes-latin.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'Great Vibes';src:url('/fonts/great-vibes-latin-ext.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Dela Gothic One';src:url('/fonts/dela-gothic-one-latin.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
      @font-face{font-family:'Dela Gothic One';src:url('/fonts/dela-gothic-one-latin-ext.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
      @font-face{font-family:'Dela Gothic One';src:url('/fonts/dela-gothic-one-cyrillic.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap;unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
      :root{
        --bg:#000000;--bg-2:#14100e;--bg-3:#1c1714;
        --fg:#f5f1ea;--fg-dim:#b8b0a4;--fg-mute:#6b6359;
        --accent:#B80000;--accent-bright:#a01818;--accent-glow:#c8102e;
        --line:rgba(245,241,234,.10);--line-strong:rgba(245,241,234,.22);
        --grain-opacity:.06;
        --font-display:"Bad Russian","Forum",serif;
        --font-title:"Forum",sans-serif;
        --font-title-blocks:"Dela Gothic One",sans-serif;
        --font-sub:"Ekaterina Velikaya Two",serif;
        --font-display-spacing:.08em;
        --font-body:'Inter',-apple-system,system-ui,sans-serif;
        --font-mono:"Dela Gothic One",sans-serif;
        --radius-xxs:4px;--radius-xs:8px;--radius-s:12px;--radius-sm:16px;
        --radius-md:24px;--radius-lg:32px;--radius-xl:40px;
      }
      [data-theme=light]{
        --bg:#f7f3ec;--bg-2:#ede6d8;--bg-3:#e2d8c6;
        --fg:#1a1715;--fg-dim:#3d3830;--fg-mute:#7a7268;
        --accent:#B80000;--accent-bright:#930000;--accent-glow:#d40000;
        --line:rgba(26,23,21,.10);--line-strong:rgba(26,23,21,.22);
        --grain-opacity:.03;
      }
      /* FR: Bad Russian не содержит французских акцентов — весь display-шрифт Great Vibes */
      html[lang='fr']{--font-display:"Great Vibes",cursive;--font-display-spacing:.02em}
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
    </style>

    <meta name="description" content="Театр ТЕТ-А-ТЕТ в Ницце. Афиша спектаклей, онлайн-бронирование билетов, новости театра и мероприятия для зрителей во Франции." />
    <link rel="canonical" href="https://www.theatre-teteatete.fr/" />

    <!-- OpenGraph / Social sharing -->
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="fr_FR" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:site_name"   content="Théâtre Tête-à-Tête" />
    <meta property="og:title"       content="Théâtre Tête-à-Tête" />
    <meta property="og:description" content="Театр в Ницце: спектакли, афиша, репертуар и онлайн-бронирование билетов." />
    <meta property="og:url"         content="https://www.theatre-teteatete.fr/" />
    <!-- og:image намеренно нет: главная делится текстовой карточкой без фотографии
         (WhatsApp, Telegram). Не подставлять сюда постеры, фото зала или труппы —
         и не указывать их как "image" в JSON-LD ниже: Telegram при отсутствии
         og:image берёт картинку оттуда (так в превью попадало старое групповое фото). -->

    <!-- Twitter Card: summary — маленькая карточка, не summary_large_image -->
    <meta name="twitter:card"        content="summary" />
    <meta name="twitter:title"       content="Théâtre Tête-à-Tête" />
    <meta name="twitter:description" content="Театр в Ницце: спектакли, афиша, репертуар и онлайн-бронирование билетов." />

    <title>Théâtre Tête-à-Tête à Nice — Spectacles en russe et billetterie</title>
    <!-- Favicons: фирменный знак театра — тот же, что в шапке сайта
         (public/images/favicon-source.png), сплошным силуэтом на прозрачном фоне,
         без подложки и контура. favicon.svg — для вкладок: чёрный знак в светлой
         теме, белый в тёмной. favicon-96x96.png (основной для Google, кратно 48px)
         и favicon.ico (16/32/48) — чёрный знак. Растр не умеет prefers-color-scheme,
         поэтому на тёмном фоне вне вкладок чёрный силуэт менее контрастен.
         У ICO явные sizes, не "any": иначе Chrome выбирает ICO вместо SVG. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <!-- iOS заливает прозрачный фон чёрным, поэтому здесь это сделано явно:
         белый знак на чёрном. В выдаче такой файл не превратится в «пустой белый кружок». -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Schema.org structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://www.theatre-teteatete.fr/#website",
            "name": "Théâtre Tête-à-Tête",
            "alternateName": "Tête-à-Tête",
            "url": "https://www.theatre-teteatete.fr/",
            "inLanguage": ["fr", "ru"],
            "publisher": { "@id": "https://www.theatre-teteatete.fr/#theatre" }
          },
          {
            "@type": "PerformingArtsTheater",
            "@id": "https://www.theatre-teteatete.fr/#theatre",
            "name": "Théâtre Tête-à-Tête",
            "alternateName": ["Tête-à-Tête", "Театр Тет-а-Тет"],
            "url": "https://www.theatre-teteatete.fr/",
            "description": "Театр ТЕТ-А-ТЕТ в Ницце. Спектакли, афиша и онлайн-бронирование билетов.",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "24 Rue Rossini",
              "addressLocality": "Nice",
              "postalCode": "06000",
              "addressCountry": "FR"
            },
            "areaServed": ["Nice", "Côte d'Azur", "France"],
            "sameAs": [
              "https://www.instagram.com/theatre_tete_a_tete/",
              "https://www.facebook.com/TheatreTeteAtete/"
            ],
            "logo": "https://www.theatre-teteatete.fr/images/favicon-source.png"
          }
        ]
      }
    </script>

    <!-- Google Analytics 4.
         Скрипт НЕ подключается здесь: GA4 ставит cookie, а театр работает во
         Франции, где для этого нужно согласие пользователя (GDPR / рекомендации
         CNIL). Загрузка выполняется из src/services/analytics.ts и только после
         явного согласия; отказ действительно означает, что gtag.js не грузится.
         Идентификатор измерения хранится тут же, чтобы его было легко заменить. -->
    <meta name="ga-measurement-id" content="G-LPLQXLMV7D" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Фирменный знак театра (тот же, что в шапке сайта), фон прозрачный. Светлая тема — чёрный знак, тёмная — белый. -->
  <style>rect{fill:#000}@media (prefers-color-scheme:dark){rect{fill:#fff}}</style>
  <mask id="glyph" mask-type="alpha" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <image href="data:image/png;base64," width="128" height="128"/>
  </mask>
  <rect width="128" height="128" mask="url(#glyph)"/>
</svg>
